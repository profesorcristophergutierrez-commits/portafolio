<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO_PAGINA}}</title>
<meta name="description" content="{{DESCRIPCION}}">
<link rel="canonical" href="{{URL}}">
<meta property="og:type" content="article">
<meta property="og:locale" content="es_CL">
<meta property="og:title" content="{{TITULO_PAGINA}}">
<meta property="og:description" content="{{DESCRIPCION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{OG}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FAFAF8">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Estudio de caso: mismo sistema que la portada. Un relato en seis pasos con el video de proceso al inicio. */
  :root { --fondo: #F9FAFC; --tinta: #0E1220; --tinta-2: #3A4152; --gris: #5A6173; --linea: #DCE0E8; --panel: #EEF1F7; --cobalto: #1740C4; --sobre: #FFFFFF; --verde: #3A4152; --letra: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fondo: #0D1018; --tinta: #EEF1F8; --tinta-2: #C5CBD9; --gris: #98A1B5; --linea: #262C3A; --panel: #151A26; --cobalto: #8FAEFF; --sobre: #0D1018; --verde: #C5CBD9; color-scheme: dark; } }
  :root[data-theme="dark"] { --fondo: #0D1018; --tinta: #EEF1F8; --tinta-2: #C5CBD9; --gris: #98A1B5; --linea: #262C3A; --panel: #151A26; --cobalto: #8FAEFF; --sobre: #0D1018; --verde: #C5CBD9; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font: 400 17px/1.55 var(--letra); -webkit-font-smoothing: antialiased; }
  img, video { display: block; max-width: 100%; height: auto; }
  a { color: var(--cobalto); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--cobalto); outline-offset: 3px; }
  .ancho { max-width: 1280px; margin: 0 auto; padding-left: 40px; padding-right: 40px; }
  .cabeza { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-top: 28px; }
  .marca { font-weight: 600; font-size: 1.02rem; color: var(--tinta); text-decoration: none; }
  .cabeza nav { display: flex; gap: 22px; }
  .cabeza nav a { color: var(--tinta); text-decoration: none; font-weight: 500; font-size: 0.98rem; }
  .cabeza nav a:hover { text-decoration: underline; text-underline-offset: 4px; }

  .apertura { padding-top: 64px; padding-bottom: 40px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 56px; align-items: end; }
  .migas { color: var(--gris); font-size: 0.95rem; margin: 0 0 18px; }
  .migas a { color: var(--gris); }
  h1 { margin: 0; font-weight: 600; font-size: clamp(2.1rem, 5vw, 4rem); line-height: 1.04; letter-spacing: -0.03em; max-width: 18ch; }
  .resumen { margin: 22px 0 0; max-width: 52ch; font-size: 1.14rem; color: var(--tinta-2); }
  .ficha { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linea); }
  .ficha li { display: grid; grid-template-columns: 130px 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--linea); font-size: 0.98rem; }
  .ficha b { font-weight: 500; color: var(--gris); }
  .logos { display: inline-flex; flex-wrap: wrap; gap: 14px 32px; align-items: center; margin-top: 22px; padding: 12px 20px; background: #E6E9F0; border-radius: 4px; }
  .logos:empty { display: none; }
  .logos img { height: 44px; width: auto; filter: grayscale(1) contrast(1.3); mix-blend-mode: multiply; }

  .video { padding-top: 32px; }
  .video video { width: 100%; aspect-ratio: 16 / 9; background: #111; border-radius: 4px; }
  .video p { margin: 12px 0 0; color: var(--gris); font-size: 0.95rem; }

  .paso { padding-top: 96px; display: grid; grid-template-columns: 300px 1fr; gap: 48px; }
  .paso h2 { margin: 0; font-weight: 600; font-size: 1.6rem; letter-spacing: -0.02em; line-height: 1.15; }
  .paso h2 small { display: block; font-weight: 500; font-size: 0.95rem; color: var(--gris); margin-bottom: 8px; }
  .paso .cuerpo > p { margin: 0 0 16px; max-width: 64ch; font-size: 1.08rem; }
  .paso .cuerpo > p:last-child { margin-bottom: 0; }

  .etapas { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; counter-reset: etapa; }
  .etapas li { border-top: 3px solid var(--cobalto); padding-top: 14px; counter-increment: etapa; }
  .etapas li::before { content: counter(etapa); display: block; font-weight: 600; color: var(--cobalto); font-size: 1.1rem; margin-bottom: 4px; }
  .etapas b { display: block; font-weight: 600; font-size: 1.08rem; }
  .etapas span { display: block; color: var(--gris); font-size: 0.95rem; line-height: 1.4; margin-top: 4px; }

  .recursos { display: grid; grid-template-columns: 1fr 1fr; gap: 36px 28px; margin-top: 8px; }
  .recurso { display: flex; flex-direction: column; align-items: flex-start; }
  .recurso .medio { width: 100%; background: var(--panel); border-radius: 4px; overflow: hidden; aspect-ratio: 16 / 9; }
  .recurso .medio img, .recurso .medio video { width: 100%; height: 100%; object-fit: cover; }
  .recurso .medio.doc { aspect-ratio: auto; background: none; }
  .recurso .medio.doc img { object-fit: contain; height: auto; }
  .recurso b { display: block; font-weight: 600; margin-top: 14px; }
  .recurso p { margin: 4px 0 8px; color: var(--gris); font-size: 0.95rem; max-width: 44ch; }
  .accion { background: none; border: 0; padding: 0; cursor: pointer; color: var(--cobalto); font-weight: 500; text-decoration: underline; text-underline-offset: 4px; text-align: left; }

  .tarjeta { background: #fff; color: #151515; border: 1px solid var(--linea); border-radius: 8px; padding: 28px 32px; max-width: 720px; box-shadow: 0 18px 40px rgba(0,0,0,0.06); }
  .tarjeta small { display: block; color: #5E6268; margin-bottom: 10px; font-size: 0.92rem; }
  .tarjeta p { margin: 0; font-size: 1.12rem; line-height: 1.5; }
  .marca-logro { background: rgba(20,20,20,0.24); border-radius: 3px; padding: 0 3px; }
  .marca-paso { background: rgba(20,20,20,0.10); border-radius: 3px; padding: 0 3px; }
  .leyenda { display: flex; gap: 24px; margin-top: 14px; font-size: 0.9rem; }
  .leyenda .l1 { color: #4A4D52; } .leyenda .l2 { color: #141414; }

  .cifras { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .cifras b { display: block; color: var(--cobalto); font-size: clamp(2.6rem, 5vw, 4rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .cifras .barra { display: block; height: 3px; width: 0; margin: 14px 0 12px; background: var(--cobalto); transition: width 1.2s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .cifras .visto .barra { width: 100%; }
  .cifras p { margin: 0; color: var(--gris); font-size: 0.95rem; line-height: 1.4; max-width: 26ch; }
  .fuente { margin: 20px 0 0; color: var(--gris); font-size: 0.9rem; }

  .siguiente { margin-top: 112px; border-top: 1px solid var(--linea); padding-top: 36px; padding-bottom: 64px; display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: baseline; }
  .siguiente a { font-weight: 500; }
  .siguiente small { color: var(--gris); display: block; }

  dialog { border: 0; padding: 0; background: transparent; color: #fff; max-width: min(1120px, 96vw); width: 100%; max-height: 96vh; }
  dialog::backdrop { background: rgba(10, 11, 13, 0.88); }
  .barra-visor { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 0 10px; }
  .barra-visor button { background: none; border: 1px solid rgba(255,255,255,.8); color: #fff; padding: 7px 16px; cursor: pointer; border-radius: 2px; }
  #visor img, #visor video { max-height: 80vh; width: auto; max-width: 100%; margin: 0 auto; background: #fff; }
  #visor iframe { display: block; width: 100%; height: 80vh; border: 0; background: #fff; }
  .pie-visor { text-align: center; margin: 12px 0 0; font-size: 0.95rem; color: #E6E6E6; }

  .js .anim { opacity: 0; transform: translateY(24px); transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .js .anim.visto { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .js .anim { opacity: 1; transform: none; transition: none; } .cifras .barra { width: 100%; transition: none; } }

  @media (max-width: 999px) {
    .apertura { grid-template-columns: 1fr; gap: 36px; }
    .paso { grid-template-columns: 1fr; gap: 20px; padding-top: 72px; }
    .etapas, .cifras { grid-template-columns: 1fr; gap: 22px; }
  }
  @media (max-width: 639px) {
    body { font-size: 16.5px; }
    .ancho { padding-left: 18px; padding-right: 18px; }
    .cabeza { padding-top: 18px; }
    .apertura { padding-top: 40px; }
    .recursos { grid-template-columns: 1fr; }
    .ficha li { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<header class="ancho cabeza">
  <a class="marca" href="../">Cristopher Gutiérrez González</a>
  <nav aria-label="Secciones"><a href="../#piezas">Piezas</a><a href="../#casos">Casos</a><a href="../#contacto">Contacto</a></nav>
</header>

<main>
  <section class="ancho apertura">
    <div>
      <p class="migas"><a href="../#casos">Casos</a> · {{CONTEXTO}}</p>
      <h1>{{TITULO}}</h1>
      <p class="resumen">{{RESUMEN}}</p>
      <div class="logos">{{LOGOS}}</div>
    </div>
    <ul class="ficha">{{FICHA}}</ul>
  </section>

  <section class="ancho video" aria-label="Video de proceso">
    <video controls playsinline preload="metadata" poster="{{POSTER}}"><source src="{{VIDEO}}" type="video/mp4">{{PISTA}}</video>
    <p>{{VIDEO_PIE}}</p>
  </section>

{{PASOS}}

  <section class="ancho siguiente">
    <div><small>Siguiente caso</small><a href="{{SIG_URL}}">{{SIG_TITULO}}</a></div>
    <a href="../">Volver al portafolio</a>
  </section>
</main>

<dialog id="visor" aria-label="Visor de piezas">
  <div class="barra-visor"><span><button type="button" id="anterior" hidden>Anterior</button> <button type="button" id="siguiente" hidden>Siguiente</button></span><button type="button" class="cerrar">Cerrar</button></div>
  <img id="v-img" src="data:," alt="" hidden>
  <video id="v-video" controls playsinline hidden></video>
  <iframe id="v-iframe" title="Recurso interactivo" hidden></iframe>
  <p class="pie-visor" id="v-leyenda"></p>
</dialog>

<script>
  const movimiento = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.documentElement.classList.add("js");
  const bloques = document.querySelectorAll(".paso, .siguiente, .cifras li");
  bloques.forEach(el => el.classList.add("anim"));
  if (movimiento && "IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visto"); io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    bloques.forEach(el => io.observe(el));
  } else { bloques.forEach(el => el.classList.add("visto")); }
  document.querySelectorAll("[data-cuenta]").forEach(b => {
    const fin = Number(b.dataset.cuenta), sufijo = b.dataset.sufijo || "";
    if (!movimiento || !("IntersectionObserver" in window)) { b.textContent = fin + sufijo; return; }
    b.textContent = "0" + sufijo;
    const io = new IntersectionObserver(es => { if (!es[0].isIntersecting) return; io.disconnect(); const t0 = performance.now();
      const paso = t => { const p = Math.min(1, (t - t0) / 1200), s = 1 - Math.pow(1 - p, 3); b.textContent = Math.round(fin * s) + sufijo; if (p < 1) requestAnimationFrame(paso); }; requestAnimationFrame(paso); }, { threshold: 0.4 });
    io.observe(b);
  });

  // Visor
  const visor = document.getElementById("visor"), vImg = document.getElementById("v-img"), vVid = document.getElementById("v-video"), vIfr = document.getElementById("v-iframe"), vLey = document.getElementById("v-leyenda"), vAnt = document.getElementById("anterior"), vSig = document.getElementById("siguiente");
  let galeria = [], pos = 0, origen = null;
  function abrir() { if (!visor.open) visor.showModal(); visor.querySelector(".cerrar").focus(); }
  function solo(el) { [vImg, vVid, vIfr].forEach(x => x.hidden = x !== el); vAnt.hidden = vSig.hidden = !(el === vImg && galeria.length > 1); }
  function mostrar() { const [src, pie] = galeria[pos]; vImg.src = src; vImg.alt = pie; vLey.textContent = pie + (galeria.length > 1 ? " (" + (pos + 1) + " de " + galeria.length + ")" : ""); }
  document.querySelectorAll("[data-galeria]").forEach(b => b.addEventListener("click", () => { origen = b; galeria = b.dataset.galeria.split("|").map(x => x.split("::")); pos = 0; solo(vImg); mostrar(); abrir(); }));
  document.querySelectorAll("[data-video]").forEach(b => b.addEventListener("click", () => { origen = b; galeria = []; solo(vVid); vVid.src = b.dataset.video; vLey.textContent = b.dataset.titulo; abrir(); vVid.play().catch(() => {}); }));
  document.querySelectorAll("[data-iframe]").forEach(b => b.addEventListener("click", () => { origen = b; galeria = []; solo(vIfr); vIfr.src = b.dataset.iframe; vLey.textContent = b.dataset.titulo; abrir(); }));
  vAnt.addEventListener("click", () => { pos = (pos - 1 + galeria.length) % galeria.length; mostrar(); });
  vSig.addEventListener("click", () => { pos = (pos + 1) % galeria.length; mostrar(); });
  visor.querySelector(".cerrar").addEventListener("click", () => visor.close());
  visor.addEventListener("click", ev => { if (ev.target === visor) visor.close(); });
  visor.addEventListener("close", () => { vVid.pause(); vVid.removeAttribute("src"); if (!vIfr.hidden) vIfr.src = "about:blank"; if (origen) origen.focus(); });
  document.addEventListener("keydown", ev => { if (!visor.open || vImg.hidden || galeria.length < 2) return; if (ev.key === "ArrowRight") vSig.click(); if (ev.key === "ArrowLeft") vAnt.click(); });
</script>
</body>
</html>
